alias: Ring Motion → Live Camera
description: Immediately start Ring live streams, show cameras on motion, then refresh low-power snapshots when live view ends.

triggers:
  - trigger: state
    entity_id:
      - binary_sensor.door_motion
      - binary_sensor.shed_motion
      - binary_sensor.side_motion
    from: "off"
    to: "on"
    id: Rear

  - trigger: state
    entity_id: binary_sensor.front_motion
    from: "off"
    to: "on"
    id: Front

conditions: []

actions:
  - variables:
      current_view: "{{ states('input_select.live_camera') }}"
      new_view: >-
        {% if trigger.id == 'Rear' and current_view in ['Front', 'All'] %}
          All
        {% elif trigger.id == 'Front' and current_view in ['Rear', 'All'] %}
          All
        {% else %}
          {{ trigger.id }}
        {% endif %}

  - parallel:
      - sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ trigger.id == 'Rear' }}"
                sequence:
                  - action: switch.turn_on
                    target:
                      entity_id:
                        - switch.door_live_stream
                        - switch.side_live_stream
                        - switch.shed_live_stream

              - conditions:
                  - condition: template
                    value_template: "{{ trigger.id == 'Front' }}"
                sequence:
                  - action: switch.turn_on
                    target:
                      entity_id:
                        - switch.front_live_stream

      - sequence:
          - action: input_select.select_option
            target:
              entity_id: input_select.live_camera
            data:
              option: "{{ new_view | trim }}"

  - delay:
      minutes: 3

  - action: input_select.select_option
    target:
      entity_id: input_select.live_camera
    data:
      option: None

  - action: switch.turn_off
    target:
      entity_id:
        - switch.door_live_stream
        - switch.side_live_stream
        - switch.shed_live_stream
        - switch.front_live_stream

  - delay:
      seconds: 5

  - action: button.press
    target:
      entity_id:
        - button.door_take_snapshot
        - button.shed_take_snapshot

mode: restart
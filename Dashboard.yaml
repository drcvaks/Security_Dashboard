- title: Camera Console
  path: camera-console
  icon: mdi:cctv
  type: sections
  max_columns: 1
  sections:
  - type: grid
    cards:
    - type: custom:mushroom-title-card
      title: 📷 CAMERA CONSOLE
      subtitle: Exterior Ready • Interior Standby
      alignment: start
      grid_options:
        columns: 12
        rows: auto
    - type: custom:mushroom-title-card
      title: Exterior Cameras
      alignment: start
      grid_options:
        columns: 12
        rows: auto
    - type: picture-entity
      entity: camera.back_steps_snapshot
      camera_image: camera.back_steps_snapshot
      name: Back Steps
      show_name: true
      show_state: false
      camera_view: auto
      aspect_ratio: '16:9'
      fit_mode: cover
      grid_options:
        columns: 6
        rows: auto
      tap_action:
        action: more-info
    - type: picture-entity
      entity: camera.deck_snapshot
      camera_image: camera.deck_snapshot
      name: Deck
      show_name: true
      show_state: false
      camera_view: auto
      aspect_ratio: '16:9'
      fit_mode: cover
      grid_options:
        columns: 6
        rows: auto
      tap_action:
        action: more-info
    - type: custom:mushroom-title-card
      title: Interior Cameras
      subtitle: Tap a camera to view live
      alignment: start
      grid_options:
        columns: 12
        rows: auto
    - type: conditional
      conditions:
      - condition: state
        entity: input_select.interior_live_camera
        state_not: Living Room
      card:
        type: custom:mushroom-template-card
        primary: Living Room
        secondary: ⚫ Camera Off • Tap to View Live
        icon: mdi:sofa
        icon_color: disabled
        fill_container: true
        tap_action:
          action: perform-action
          perform_action: input_select.select_option
          target:
            entity_id: input_select.interior_live_camera
          data:
            option: Living Room
      grid_options:
        columns: 12
        rows: 2
    - type: conditional
      conditions:
      - condition: state
        entity: input_select.interior_live_camera
        state: Living Room
      card:
        type: picture-entity
        entity: camera.living_room_live_view
        camera_image: camera.living_room_live_view
        camera_view: live
        name: Living Room • LIVE
        show_name: true
        show_state: false
        aspect_ratio: '16:9'
        fit_mode: cover
        tap_action:
          action: perform-action
          perform_action: input_select.select_option
          target:
            entity_id: input_select.interior_live_camera
          data:
            option: None
      grid_options:
        columns: 12
        rows: 4
    - type: conditional
      conditions:
      - condition: state
        entity: input_select.interior_live_camera
        state_not: Kitchen
      card:
        type: custom:mushroom-template-card
        primary: Kitchen
        secondary: ⚫ Camera Off • Tap to View Live
        icon: mdi:silverware-fork-knife
        icon_color: disabled
        fill_container: true
        tap_action:
          action: perform-action
          perform_action: input_select.select_option
          target:
            entity_id: input_select.interior_live_camera
          data:
            option: Kitchen
      grid_options:
        columns: 12
        rows: 2
    - type: conditional
      conditions:
      - condition: state
        entity: input_select.interior_live_camera
        state: Kitchen
      card:
        type: picture-entity
        entity: camera.kitchen_live_view
        camera_image: camera.kitchen_live_view
        camera_view: live
        name: Kitchen • LIVE
        show_name: true
        show_state: false
        aspect_ratio: '16:9'
        fit_mode: cover
        tap_action:
          action: perform-action
          perform_action: input_select.select_option
          target:
            entity_id: input_select.interior_live_camera
          data:
            option: None
      grid_options:
        columns: 12
        rows: 4
    - type: conditional
      conditions:
      - condition: state
        entity: input_select.interior_live_camera
        state_not: Basement
      card:
        type: custom:mushroom-template-card
        primary: Basement
        secondary: ⚫ Camera Off • Tap to View Live
        icon: mdi:stairs-down
        icon_color: disabled
        fill_container: true
        tap_action:
          action: perform-action
          perform_action: input_select.select_option
          target:
            entity_id: input_select.interior_live_camera
          data:
            option: Basement
      grid_options:
        columns: 12
        rows: 2
    - type: conditional
      conditions:
      - condition: state
        entity: input_select.interior_live_camera
        state: Basement
      card:
        type: picture-entity
        entity: camera.basement_live_view
        camera_image: camera.basement_live_view
        camera_view: live
        name: Basement • LIVE
        show_name: true
        show_state: false
        aspect_ratio: '16:9'
        fit_mode: cover
        tap_action:
          action: perform-action
          perform_action: input_select.select_option
          target:
            entity_id: input_select.interior_live_camera
          data:

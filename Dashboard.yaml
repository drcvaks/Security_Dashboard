views:
  - title: Cameras
    type: panel

    cards:
      - type: vertical-stack
        cards:

          # ─────────────────────────────────────────────
          # SECURITY CONSOLE STATUS BAR
          # ─────────────────────────────────────────────
          - type: horizontal-stack
            cards:

              # TIME
              - type: clock
                clock_style: digital
                clock_size: small
                time_format: "12"
                show_seconds: false
                no_background: false

              # CAMERA STATUS
              - type: markdown
                entity_id:
                  - input_select.live_camera
                card_size: 1
                content: >-
                  {% set mode = states('input_select.live_camera') %}

                  {% if mode == 'Rear' %}
                  ## 🔴 DOOR • SIDE • SHED LIVE
                  {% elif mode == 'Front' %}
                  ## 🔴 FRONT LIVE
                  {% elif mode == 'All' %}
                  ## 🔴 ALL CAMERAS LIVE
                  {% else %}
                  ## 🟢 MONITORING
                  {% endif %}

              # ALARM STATUS
              - type: markdown
                entity_id:
                  - alarm_control_panel.home_alarm
                card_size: 1
                content: >-
                  {% set alarm = states('alarm_control_panel.home_alarm') %}

                  {% if alarm == 'armed_home' %}
                  ## 🏠 ARMED HOME
                  {% elif alarm == 'armed_away' %}
                  ## 🛡️ ARMED AWAY
                  {% elif alarm == 'armed_night' %}
                  ## 🌙 ARMED NIGHT
                  {% elif alarm == 'arming' %}
                  ## ⏳ ARMING
                  {% elif alarm == 'pending' %}
                  ## ⏳ ENTRY DELAY
                  {% elif alarm == 'triggered' %}
                  ## 🚨 ALARM TRIGGERED
                  {% elif alarm == 'unavailable' %}
                  ## ⚠️ ALARM UNAVAILABLE
                  {% else %}
                  ## 🔓 DISARMED
                  {% endif %}

          # ─────────────────────────────────────────────
          # CAMERA GRID
          # ─────────────────────────────────────────────
          - type: grid
            columns: 2
            square: false
            cards:

              # DOOR — SNAPSHOT
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_select.live_camera
                    state_not: Rear
                  - condition: state
                    entity: input_select.live_camera
                    state_not: All
                card:
                  type: picture-entity
                  entity: camera.door_snapshot
                  camera_image: camera.door_snapshot
                  name: Door
                  show_name: true
                  show_state: false
                  aspect_ratio: "16:9"
                  fit_mode: cover
                  tap_action:
                    action: perform-action
                    perform_action: script.manual_ring_camera_live
                    data:
                      camera: Rear

              # DOOR — LIVE
              - type: conditional
                conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity: input_select.live_camera
                        state: Rear
                      - condition: state
                        entity: input_select.live_camera
                        state: All
                card:
                  type: picture-entity
                  entity: camera.door_live_view
                  camera_image: camera.door_live_view
                  camera_view: live
                  name: "Door • LIVE"
                  show_name: true
                  show_state: false
                  aspect_ratio: "16:9"
                  fit_mode: cover
                  tap_action:
                    action: perform-action
                    perform_action: script.manual_ring_camera_live
                    data:
                      camera: Rear

              # SHED — SNAPSHOT
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_select.live_camera
                    state_not: Rear
                  - condition: state
                    entity: input_select.live_camera
                    state_not: All
                card:
                  type: picture-entity
                  entity: camera.shed_snapshot
                  camera_image: camera.shed_snapshot
                  name: Shed
                  show_name: true
                  show_state: false
                  aspect_ratio: "16:9"
                  fit_mode: cover
                  tap_action:
                    action: perform-action
                    perform_action: script.manual_ring_camera_live
                    data:
                      camera: Rear

              # SHED — LIVE
              - type: conditional
                conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity: input_select.live_camera
                        state: Rear
                      - condition: state
                        entity: input_select.live_camera
                        state: All
                card:
                  type: picture-entity
                  entity: camera.shed_live_view
                  camera_image: camera.shed_live_view
                  camera_view: live
                  name: "Shed • LIVE"
                  show_name: true
                  show_state: false
                  aspect_ratio: "16:9"
                  fit_mode: cover
                  tap_action:
                    action: perform-action
                    perform_action: script.manual_ring_camera_live
                    data:
                      camera: Rear

              # FRONT — SNAPSHOT
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_select.live_camera
                    state_not: Front
                  - condition: state
                    entity: input_select.live_camera
                    state_not: All
                card:
                  type: picture-entity
                  entity: camera.front_snapshot
                  camera_image: camera.front_snapshot
                  name: Front
                  show_name: true
                  show_state: false
                  aspect_ratio: "16:9"
                  fit_mode: cover
                  tap_action:
                    action: perform-action
                    perform_action: script.manual_ring_camera_live
                    data:
                      camera: Front

              # FRONT — LIVE
              - type: conditional
                conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity: input_select.live_camera
                        state: Front
                      - condition: state
                        entity: input_select.live_camera
                        state: All
                card:
                  type: picture-entity
                  entity: camera.front_live_view
                  camera_image: camera.front_live_view
                  camera_view: live
                  name: "Front • LIVE"
                  show_name: true
                  show_state: false
                  aspect_ratio: "16:9"
                  fit_mode: cover
                  tap_action:
                    action: perform-action
                    perform_action: script.manual_ring_camera_live
                    data:
                      camera: Front

              # SIDE — SNAPSHOT
              - type: conditional
                conditions:
                  - condition: state
                    entity: input_select.live_camera
                    state_not: Rear
                  - condition: state
                    entity: input_select.live_camera
                    state_not: All
                card:
                  type: picture-entity
                  entity: camera.side_snapshot
                  camera_image: camera.side_snapshot
                  name: Side
                  show_name: true
                  show_state: false
                  aspect_ratio: "16:9"
                  fit_mode: cover
                  tap_action:
                    action: perform-action
                    perform_action: script.manual_ring_camera_live
                    data:
                      camera: Rear

              # SIDE — LIVE
              - type: conditional
                conditions:
                  - condition: or
                    conditions:
                      - condition: state
                        entity: input_select.live_camera
                        state: Rear
                      - condition: state
                        entity: input_select.live_camera
                        state: All
                card:
                  type: picture-entity
                  entity: camera.side_live_view
                  camera_image: camera.side_live_view
                  camera_view: live
                  name: "Side • LIVE"
                  show_name: true
                  show_state: false
                  aspect_ratio: "16:9"
                  fit_mode: cover
                  tap_action:
                    action: perform-action
                    perform_action: script.manual_ring_camera_live
                    data:
                      camera: Rear